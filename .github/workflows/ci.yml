name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# cancel in progress when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Download deps
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Download deps
        run: go mod download
      # Check if `go fix ./...` would change anything
      - name: Fix
        run: |
          go fix ./...
          if ! git diff --exit-code; then
            echo "::error::go fix ./... changed files; run 'just fix' and commit the result"
            exit 1
          fi
      # Installs the tools pinned in mise.toml and puts them on PATH.
      - uses: jdx/mise-action@v4
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: none
