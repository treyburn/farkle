name: Release

on:
  release:
    types:
      - published

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Download deps
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Installs the tools pinned in mise.toml and puts them on PATH.
      - uses: jdx/mise-action@v4
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: none

  build:
    needs:
      - test
      - lint
    runs-on: ubuntu-slim
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Asset names must stay stable across releases so the
      # /releases/latest/download/<name> links in the README keep resolving.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o "farkle-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/farkle
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "farkle-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" --clobber

  trigger-deploy:
    needs:
      - build
    runs-on: ubuntu-slim
    steps:
      - name: Trigger pkgs deploy
        env:
          GH_TOKEN: ${{ secrets.GO_PAGES_PAT }}
        run: |
          gh api repos/treyburn/pkgs/dispatches \
            -f event_type=vanity-release \
            -f "client_payload[version]=${GITHUB_REF_NAME}"
