name: Bug report
description: Something isn't working the way it should.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      description: A brief description of the problem, and what you expected instead.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The release you're running - the tag name, or the binary you downloaded. You can get this from running `farkle --version`.
      placeholder: v0.1.0
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If you have any screenshots, please drop them here. They are super helpful! Terminal output pasted as text is great too.
    validations:
      required: false
